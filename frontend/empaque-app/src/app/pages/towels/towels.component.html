<h2 class="text-2xl font-bold text-gray-800 mb-6">Unidades (Items)</h2>

<div class="flex items-center gap-3 mb-6">
  <input
    [(ngModel)]="itemCode"
    placeholder="ItemCode"
    class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
  />
  <input
    [(ngModel)]="productCode"
    placeholder="ProductCode"
    class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
  />
  <button
    (click)="create()"
    [disabled]="loading"
    class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 disabled:opacity-50"
  >
    Guardar unidad
  </button>
</div>

@if (error) {
  <div class="bg-red-50 text-red-700 border border-red-200 rounded-lg p-3 mb-4">{{ error }}</div>
}

<table class="w-full border-collapse">
  <thead>
    <tr class="bg-gray-100 text-left text-sm font-semibold text-gray-700">
      <th class="px-4 py-3 border-b border-gray-200">ItemCode</th>
      <th class="px-4 py-3 border-b border-gray-200">ProductCode</th>
      <th class="px-4 py-3 border-b border-gray-200">Status</th>
      <th class="px-4 py-3 border-b border-gray-200">BoxId</th>
      <th class="px-4 py-3 border-b border-gray-200">Acciones</th>
    </tr>
  </thead>
  <tbody>
    @for (t of towels; track t.towelId) {
      <tr class="even:bg-gray-50 border-b border-gray-200">
        <td class="px-4 py-3 text-sm text-gray-800">{{ t.itemCode }}</td>
        <td class="px-4 py-3 text-sm text-gray-800">{{ t.productCode }}</td>
        <td class="px-4 py-3 text-sm">
          @if (t.status === 'LOOSE') {
            <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs font-semibold">
              {{ t.status }}
            </span>
          } @else {
            <span class="bg-green-100 text-green-700 px-2 py-0.5 rounded-full text-xs font-semibold">
              {{ t.status }}
            </span>
          }
        </td>
        <td class="px-4 py-3 text-sm text-gray-800">{{ t.boxId ?? '—' }}</td>
        <td class="px-4 py-3 text-sm">
          <button
            class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600 disabled:opacity-50"
            (click)="disable(t)"
            [disabled]="t.status === 'PACKED'"
          >
            Deshabilitar
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="px-4 py-8 text-center text-gray-400 text-sm">No hay unidades registradas</td>
      </tr>
    }
  </tbody>
</table>
